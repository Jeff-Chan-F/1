<script>
(() => {
    'use strict';

    const doc = document;
    const root = doc.documentElement;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const header = doc.querySelector('[data-header]');
    const progress = doc.querySelector('[data-progress]');
    const toTop = doc.querySelector('[data-to-top]');

    function onScroll() {
        const y = window.scrollY || root.scrollTop;

        if (header) {
            header.classList.toggle('is-scrolled', y > 30);
        }

        if (toTop) {
            toTop.classList.toggle('is-visible', y > 640);
        }

        if (progress) {
            const total = root.scrollHeight - window.innerHeight;
            const ratio = total > 0 ? Math.min(1, Math.max(0, y / total)) : 0;
            progress.style.transform = 'scaleX(' + ratio + ')';
        }
    }

    let ticking = false;
    window.addEventListener('scroll', () => {
        if (ticking) {
            return;
        }
        ticking = true;
        window.requestAnimationFrame(() => {
            onScroll();
            ticking = false;
        });
    }, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    onScroll();

    const navToggle = doc.querySelector('[data-nav-toggle]');
    const nav = doc.querySelector('[data-nav]');

    function setNav(open) {
        if (!navToggle) {
            return;
        }
        navToggle.setAttribute('aria-expanded', String(open));
        navToggle.setAttribute('aria-label', open ? '关闭导航菜单' : '打开导航菜单');
        doc.body.classList.toggle('nav-open', open);
    }

    if (navToggle) {
        navToggle.addEventListener('click', () => {
            setNav(navToggle.getAttribute('aria-expanded') !== 'true');
        });

        if (nav) {
            nav.addEventListener('click', (event) => {
                if (event.target.closest('a')) {
                    setNav(false);
                }
            });
        }

        doc.addEventListener('click', (event) => {
            if (!event.target.closest('.site-header')) {
                setNav(false);
            }
        });

        doc.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                setNav(false);
            }
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth > 960) {
                setNav(false);
            }
        });
    }

    if (toTop) {
        toTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
        });
    }

    const revealItems = Array.from(doc.querySelectorAll('[data-reveal]'));

    if (revealItems.length) {
        if (!('IntersectionObserver' in window)) {
            revealItems.forEach((item) => item.classList.add('is-visible'));
        } else {
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    entry.target.classList.toggle('is-visible', entry.isIntersecting);
                });
            }, { rootMargin: '0px' });

            let revealFrame = 0;

            const syncRevealSides = () => {
                revealFrame = 0;

                revealItems.forEach((item) => {
                    if (item.classList.contains('is-visible')) {
                        return;
                    }

                    const rect = item.getBoundingClientRect();
                    const leftTop = rect.bottom <= 0;
                    const leftBottom = rect.top >= window.innerHeight;

                    item.classList.toggle('exit-top', leftTop);
                    item.classList.toggle('exit-bottom', leftBottom && !leftTop);
                });
            };

            revealItems.forEach((item) => revealObserver.observe(item));
            syncRevealSides();

            window.addEventListener('scroll', () => {
                if (!revealFrame) {
                    revealFrame = requestAnimationFrame(syncRevealSides);
                }
            }, { passive: true });
        }
    }

    const tocLinks = Array.from(doc.querySelectorAll('[data-toc] a[href^="#"]'));

    if (tocLinks.length && 'IntersectionObserver' in window) {
        const sections = tocLinks
            .map((link) => doc.querySelector(link.getAttribute('href')))
            .filter(Boolean);

        const setActive = (id) => {
            tocLinks.forEach((link) => {
                const match = link.getAttribute('href') === '#' + id;
                link.classList.toggle('is-active', match);
                if (match) {
                    link.setAttribute('aria-current', 'true');
                } else {
                    link.removeAttribute('aria-current');
                }
            });
        };

        const spy = new IntersectionObserver((entries) => {
            const visible = entries
                .filter((entry) => entry.isIntersecting)
                .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);

            if (visible.length) {
                setActive(visible[0].target.id);
            }
        }, { rootMargin: '-20% 0px -68% 0px', threshold: 0 });

        sections.forEach((section) => spy.observe(section));
    }
})();

(() => {
    'use strict';

    const carousel = document.querySelector('.poster-carousel');
    const canvas = document.querySelector('.star-field');

    if (carousel) {
        const slides = Array.from(carousel.querySelectorAll('.poster-slide'));
        const currentCount = carousel.querySelector('.poster-current');
        const caption = carousel.querySelector('.poster-caption-text');
        const previousPreview = carousel.querySelector('.poster-preview--previous');
        const nextPreview = carousel.querySelector('.poster-preview--next');
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        const AUTOPLAY_DELAY = 3000;

        let activeIndex = 0;
        let autoplayTimer = null;

        function showSlide(index) {
            activeIndex = (index + slides.length) % slides.length;

            const activeSlide = slides[activeIndex];
            const previousSlide = slides[(activeIndex - 1 + slides.length) % slides.length];
            const nextSlide = slides[(activeIndex + 1) % slides.length];

            if (previousPreview) {
                previousPreview.querySelector('img').src = previousSlide.querySelector('img').src;
                previousPreview.setAttribute('aria-label', '预览上一张海报:' + previousSlide.querySelector('img').alt);
            }

            if (nextPreview) {
                nextPreview.querySelector('img').src = nextSlide.querySelector('img').src;
                nextPreview.setAttribute('aria-label', '预览下一张海报:' + nextSlide.querySelector('img').alt);
            }

            slides.forEach((slide, slideIndex) => {
                const isActive = slideIndex === activeIndex;
                slide.classList.toggle('is-active', isActive);
                slide.setAttribute('aria-hidden', String(!isActive));
            });

            if (currentCount) {
                currentCount.textContent = String(activeIndex + 1).padStart(2, '0');
            }

            if (caption) {
                caption.textContent = activeSlide.querySelector('img').alt;
                caption.style.animation = 'none';
                void caption.offsetWidth;
                caption.style.animation = '';
            }
        }

        function stopAutoplay() {
            window.clearInterval(autoplayTimer);
            autoplayTimer = null;
        }

        function startAutoplay() {
            stopAutoplay();
            if (reducedMotion.matches || document.hidden) {
                return;
            }
            if (carousel.matches(':hover') || carousel.contains(document.activeElement)) {
                return;
            }
            autoplayTimer = window.setInterval(() => showSlide(activeIndex + 1), AUTOPLAY_DELAY);
        }

        function goTo(index) {
            showSlide(index);
            startAutoplay();
        }

        const previousArrow = carousel.querySelector('.poster-arrow--previous');
        const nextArrow = carousel.querySelector('.poster-arrow--next');

        if (previousArrow) {
            previousArrow.addEventListener('click', () => goTo(activeIndex - 1));
        }

        if (nextArrow) {
            nextArrow.addEventListener('click', () => goTo(activeIndex + 1));
        }

        if (previousPreview) {
            previousPreview.addEventListener('click', () => goTo(activeIndex - 1));
        }

        if (nextPreview) {
            nextPreview.addEventListener('click', () => goTo(activeIndex + 1));
        }

        let swipeStart = null;

        carousel.addEventListener('pointerdown', (event) => {
            if (event.pointerType === 'mouse') {
                return;
            }

            swipeStart = { x: event.clientX, y: event.clientY, time: Date.now() };
            stopAutoplay();
        });

        carousel.addEventListener('pointerup', (event) => {
            if (!swipeStart) {
                return;
            }

            const deltaX = event.clientX - swipeStart.x;
            const deltaY = event.clientY - swipeStart.y;
            const elapsed = Date.now() - swipeStart.time;
            swipeStart = null;
            startAutoplay();

            if (elapsed > 700 || Math.abs(deltaX) < 42 || Math.abs(deltaY) > 60) {
                return;
            }

            goTo(deltaX < 0 ? activeIndex + 1 : activeIndex - 1);
        });

        carousel.addEventListener('pointercancel', () => {
            swipeStart = null;
            startAutoplay();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'ArrowLeft') {
                goTo(activeIndex - 1);
            } else if (event.key === 'ArrowRight') {
                goTo(activeIndex + 1);
            }
        });

        carousel.addEventListener('mouseenter', stopAutoplay);
        carousel.addEventListener('mouseleave', startAutoplay);
        carousel.addEventListener('focusin', stopAutoplay);
        carousel.addEventListener('focusout', (event) => {
            if (!carousel.contains(event.relatedTarget)) {
                startAutoplay();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopAutoplay();
            } else {
                startAutoplay();
            }
        });

        reducedMotion.addEventListener('change', startAutoplay);

        showSlide(0);
        startAutoplay();
    }

    if (canvas) {
        const ctx = canvas.getContext('2d');
        const host = canvas.parentElement;
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        const SIZE = 64;
        const sprite = document.createElement('canvas');
        sprite.width = SIZE;
        sprite.height = SIZE;
        const spriteCtx = sprite.getContext('2d');
        const glow = spriteCtx.createRadialGradient(SIZE / 2, SIZE / 2, 0, SIZE / 2, SIZE / 2, SIZE / 2);
        glow.addColorStop(0, 'rgba(255, 248, 222, 1)');
        glow.addColorStop(0.22, 'rgba(255, 223, 128, 0.9)');
        glow.addColorStop(0.55, 'rgba(252, 199, 78, 0.28)');
        glow.addColorStop(1, 'rgba(252, 199, 78, 0)');
        spriteCtx.fillStyle = glow;
        spriteCtx.fillRect(0, 0, SIZE, SIZE);

        let width = 0;
        let height = 0;
        let stars = [];
        let frameId = null;
        let lastTime = 0;

        function makeStar(spread) {
            const depth = Math.random();
            return {
                x: Math.random() * width,
                y: spread ? Math.random() * height : -30 - Math.random() * 120,
                radius: 2.4 + depth * 5.2,
                speed: 10 + depth * 34,
                sway: 6 + Math.random() * 18,
                phase: Math.random() * Math.PI * 2,
                twinkle: 0.5 + Math.random() * 1.7,
                alpha: 0.3 + depth * 0.6
            };
        }

        function buildStars() {
            const count = Math.round(Math.min(90, Math.max(36, (width * height) / 18000)));
            stars = Array.from({ length: count }, () => makeStar(true));
        }

        function resize() {
            const rect = host.getBoundingClientRect();
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = Math.max(1, rect.width);
            height = Math.max(1, rect.height);
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            buildStars();
        }

        function draw(time) {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < stars.length; i += 1) {
                const star = stars[i];
                const x = star.x + Math.sin(time * 0.0006 + star.phase) * star.sway;
                const flicker = 0.55 + 0.45 * Math.sin(time * 0.001 * star.twinkle + star.phase);
                const size = star.radius * 2;
                ctx.globalAlpha = Math.max(0, Math.min(1, star.alpha * flicker));
                ctx.drawImage(sprite, x - size, star.y - size, size * 2, size * 2);
            }
            ctx.globalAlpha = 1;
        }

        function step(time) {
            frameId = window.requestAnimationFrame(step);
            const delta = lastTime ? Math.min((time - lastTime) / 1000, 0.05) : 0.016;
            lastTime = time;
            for (let i = 0; i < stars.length; i += 1) {
                const star = stars[i];
                star.y += star.speed * delta;
                if (star.y - star.radius * 4 > height) {
                    stars[i] = makeStar(false);
                }
            }
            draw(time);
        }

        function stop() {
            if (frameId !== null) {
                window.cancelAnimationFrame(frameId);
                frameId = null;
            }
            lastTime = 0;
        }

        function sync() {
            if (reducedMotion.matches || document.hidden) {
                stop();
            } else if (frameId === null) {
                frameId = window.requestAnimationFrame(step);
            }
        }

        resize();
        if ('ResizeObserver' in window) {
            new ResizeObserver(resize).observe(host);
        } else {
            window.addEventListener('resize', resize);
        }
        document.addEventListener('visibilitychange', sync);
        reducedMotion.addEventListener('change', sync);
        sync();
    }
})();
    </script>
